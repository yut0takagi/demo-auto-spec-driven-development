name: release

# develop → main の「常設昇格 PR」を維持する（自動マージはしない）。
# 自走ループが develop を更新し続けるので、常に develop→main の PR を 1 本開いておく。
# GitHub は develop→main の PR を「常に develop 最新 vs main」で再計算するため、develop に
# 新しいマージが積まれるたび、この PR の中身は自動で追記・更新される（ワークフローは PR の
# 有無を保証し、タイトルの待ち commit 数を更新するだけ）。人間はこの PR を **ボタン 1 つで
# マージ**すれば本番反映。マージ判断は人間に残す＝最後の砦は維持。

on:
  push:
    branches: [develop]       # develop が進んだ瞬間に常設 PR を即最新化（schedule 遅延の空白を埋める）
  schedule:
    - cron: '*/30 * * * *'   # 30 分ごと（best-effort）に常設 PR の存在を保証・件数を更新
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  standing-pr:
    # キルスイッチ: 変数が false なら常設 PR を維持しない
    if: vars.AUTO_PROMOTE_PR != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: develop → main の常設昇格 PR を維持
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          N=$(git rev-list --count origin/main..origin/develop)
          if [ "$N" -eq 0 ]; then
            echo "develop == main。昇格 PR は不要。"
            exit 0
          fi
          TITLE="release: develop → main 昇格（${N} commits 待ち）"
          BODY=$(printf '%s\n' \
            "自走ループが develop に積んだ **${N} commits** を main（本番）へ。" \
            "" \
            "準備できたら、この PR を **マージするだけ**（ボタン 1 つ）で本番反映されます。" \
            "develop 側は verify / e2e / adversary を毎マージ通過済みなので、中身は検証済みです。" \
            "" \
            "_この PR は release.yml が常設で維持し、develop が進むたび自動で最新化されます。_")
          PR=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            URL=$(gh pr create --base main --head develop --title "$TITLE" --body "$BODY")
            PR=$(printf '%s' "$URL" | grep -oE '[0-9]+$')
            echo "常設 PR #${PR} を新規作成した。"
          else
            gh pr edit "$PR" --title "$TITLE" --body "$BODY"
            echo "常設 PR #${PR} を最新（${N} commits 待ち）に更新した。"
          fi
          # 自動リコンサイル: squash 昇格などで main↔develop の履歴が分岐しても、main を
          # develop に取り込んで揃える。これで常設 PR の diff / コミット数が常にクリーンに保たれ、
          # BEHIND（main が develop 未取り込みの過去マージを持つ状態）も自動解消される。
          gh pr update-branch "$PR" 2>&1 | tail -1 || echo "update-branch は不要 or 一時失敗（次回再試行）"
